name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: "0"
  GOFLAGS: "-trimpath"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go vet ./...
      - run: go test ./...

  # Build for every OS/arch combo that cross-compiles from linux CI, including
  # the odd ones (MIPS family, riscv64, ppc64, s390x, loong64, …). The list is
  # exactly `go tool dist list` for a Go 1.23 toolchain, minus ios/android/js
  # (which need their host toolchain) — generated with `go tool dist list`.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair:
          - darwin/amd64
          - darwin/arm64
          - dragonfly/amd64
          - freebsd/386
          - freebsd/amd64
          - freebsd/arm
          - freebsd/arm64
          - linux/386
          - linux/amd64
          - linux/arm
          - linux/arm64
          - linux/loong64
          - linux/mips
          - linux/mips64
          - linux/mips64le
          - linux/mipsle
          - linux/ppc64
          - linux/ppc64le
          - linux/riscv64
          - linux/s390x
          - netbsd/386
          - netbsd/amd64
          - netbsd/arm
          - netbsd/arm64
          - openbsd/386
          - openbsd/amd64
          - openbsd/arm
          - openbsd/arm64
          - openbsd/ppc64
          - openbsd/riscv64
          - windows/386
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Build
        id: build
        run: |
          pair="${{ matrix.pair }}"
          goos="${pair%/*}"; goarch="${pair#*/}"
          mkdir -p dist
          filename="ndpm-$goos-$goarch"
          if [ "$goos" = "windows" ]; then filename="$filename.exe"; fi
          # slash-free artifact name for upload-artifact v4
          echo "binname=$filename" >> "$GITHUB_OUTPUT"
          GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "dist/$filename" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.binname }}
          path: dist/*

  # Collect all binaries and attach to the GitHub release.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ndpm-*
          generate_release_notes: true

  # Multi-arch OCI image on GHCR.
  docker:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386,linux/riscv64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
